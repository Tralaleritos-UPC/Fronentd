<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignLingo - Inicio de sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0d0d0d;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            position: relative;
        }

        /* Left side - Welcome section */
        .welcome-section {
            flex: 1;
            background: linear-gradient(135deg, #0a6640 0%, #054a2e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .welcome-content {
            text-align: center;
            color: white;
            z-index: 1;
            animation: fadeInLeft 0.8s ease-out;
        }

        .hand-icon {
            font-size: 80px;
            margin-bottom: 30px;
            animation: wave 2s infinite;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        .welcome-content h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        .welcome-content p {
            font-size: 20px;
            font-weight: 300;
            opacity: 0.95;
        }

        /* Right side - Login form */
        .login-section {
            flex: 1;
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        /* Línea divisoria en forma de S */
        .s-divider {
            position: absolute;
            left: 50%;
            top: 0;
            height: 100%;
            width: 4px;
            transform: translateX(-50%);
            z-index: 100;
            pointer-events: none;
        }

        .s-divider svg {
            width: 100%;
            height: 100%;
        }

        /* Formas orgánicas de fondo */
        .login-section::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(ellipse 80% 70% at 40% 30%, rgba(50, 70, 80, 0.3) 0%, transparent 70%);
            border-radius: 40% 60% 65% 35% / 35% 65% 40% 60%;
            top: -100px;
            right: -150px;
            animation: float 6s ease-in-out infinite;
        }

        .login-section::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(ellipse 80% 70% at 60% 70%, rgba(50, 70, 80, 0.2) 0%, transparent 70%);
            border-radius: 50% 40% 55% 45% / 45% 55% 40% 50%;
            bottom: -200px;
            left: -100px;
            animation: float-reverse 7s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        @keyframes float-reverse {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, 30px); }
        }

        .login-container {
            background: rgba(40, 50, 60, 0.4);
            padding: 50px;
            border-radius: 40% 60% 70% 30% / 30% 70% 40% 60%;
            width: 100%;
            max-width: 420px;
            z-index: 2;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 120, 140, 0.2);
            animation: fadeInRight 0.8s ease-out;
            position: relative;
        }

        .login-title {
            color: white;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #b2bec3;
            font-size: 13px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #404854;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input::placeholder {
            color: #95a5a6;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0a6640;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(10, 102, 64, 0.15);
        }

        .confirm-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #0a6640 0%, #054a2e 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .confirm-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(10, 102, 64, 0.3);
        }

        .confirm-btn:active {
            transform: translateY(0);
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }

        .signup-link a {
            color: #0a9d5e;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .signup-link a:hover {
            color: #0db877;
            text-decoration: underline;
        }

        .signup-link span {
            color: #95a5a6;
        }

        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .welcome-section {
                min-height: 250px;
            }

            .login-section {
                flex: 1;
            }

            .welcome-content h1 {
                font-size: 32px;
            }

            .login-container {
                max-width: 100%;
            }

            .s-divider {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="welcome-section">
            <div class="welcome-content">
                <div class="hand-icon">👋</div>
                <h1>Bienvenido a SignLingo</h1>
                <p>Tus manos tienen mucho que decir.</p>
            </div>
        </div>

        <div class="login-section">
            <div class="login-container">
                <h2 class="login-title">Inicio de sesión</h2>
                
                <form>
                    <div class="form-group">
                        <label>Correo electrónico</label>
                        <input type="email" placeholder="Email" required>
                    </div>

                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" placeholder="••••••••••••••••" required>
                    </div>

                    <button type="submit" class="confirm-btn">Confirmar</button>
                </form>

                <div class="signup-link">
                    <span>¿No tienes una cuenta?</span>
                    <a href="#">Regístrate aquí</a>
                </div>
            </div>
        </div>

        <!-- Línea divisoria en forma de S -->
        <div class="s-divider">
            <svg viewBox="0 0 100 800" preserveAspectRatio="none">
                <path d="M 50 0 Q 80 100 50 200 Q 20 300 50 400 Q 80 500 50 600 Q 20 700 50 800" 
                      stroke="rgba(255, 255, 255, 0.15)" 
                      stroke-width="3" 
                      fill="none"
                      stroke-linecap="round"/>
            </svg>
        </div>
    </div>
</body>
</html>
