<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="20" fill="#f5f5f5"/>
  
  <!-- Thumbs up hand -->
  <g transform="translate(50, 40)">
    <!-- Thumb -->
    <ellipse cx="40" cy="30" rx="12" ry="25" fill="#2c3e50" transform="rotate(-15 40 30)"/>
    
    <!-- Hand base -->
    <rect x="25" y="45" width="30" height="70" rx="15" fill="#2c3e50"/>
    
    <!-- Fingers -->
    <rect x="20" y="50" width="8" height="45" rx="4" fill="#2c3e50"/>
    <rect x="30" y="45" width="8" height="50" rx="4" fill="#2c3e50"/>
    <rect x="40" y="48" width="8" height="47" rx="4" fill="#2c3e50"/>
    <rect x="50" y="52" width="8" height="43" rx="4" fill="#2c3e50"/>
  </g>
  
  <!-- Label text -->
  <text x="100" y="160" text-anchor="middle" fill="#666" font-family="Arial" font-size="14">Señas en LSP</text>
</svg>